# LOCAL LAB ONLY. Real routers are read from the radius_client view (read_clients = yes in
# mods-available/sql) and reach RADIUS only over WireGuard (N6).
#
# This entry lets radtest run inside the container. The secret comes from the environment
# (RADIUS_LAB_SECRET in infra/.env) and must never be used outside a developer machine.

client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = "$ENV{RADIUS_LAB_SECRET}"
	require_message_authenticator = no
	shortname = localhost
	nas_type = other
}
