# No static clients. Every NAS, including the local radtest "router" on 127.0.0.1, is read from
# the radius_client_v2 view (read_clients = yes in mods-available/sql), so a lab login goes through
# exactly the same client and tenant checks (T3) as a real router reaching RADIUS over WireGuard (N6).
#
# Clients are loaded at startup: after adding a router row, restart FreeRADIUS
# (infra/lab/scripts/seed.ps1 does this for the lab).
