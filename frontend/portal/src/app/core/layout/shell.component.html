<div class="shell">
  <header class="topbar">
    <div class="brand">
      @if (branding().logoUrl; as logoUrl) {
        <img class="logo" [src]="logoUrl" alt="" />
      } @else {
        <span class="initial" aria-hidden="true">{{ branding().name.charAt(0) }}</span>
      }
      <span class="name">{{ branding().name }}</span>
    </div>
    <nav class="tabs" aria-label="Main">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
          <tabler-icon [icon]="item.icon" [size]="20" aria-hidden="true" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="who">
      @if (customer(); as c) {
        <span class="customer">
          <span class="customer-name">{{ c.name }}</span>
          <span class="customer-number">{{ c.number }}</span>
        </span>
      }
      <button
        mat-icon-button
        type="button"
        (click)="signOut()"
        aria-label="Sign out"
        title="Sign out"
      >
        <tabler-icon [icon]="logoutIcon" [size]="20" />
      </button>
    </div>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
