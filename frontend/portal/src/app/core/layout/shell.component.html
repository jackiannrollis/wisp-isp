<div class="shell">
  <header class="topbar">
    @if (branding().logoUrl; as logoUrl) {
      <img class="logo" [src]="logoUrl" [alt]="branding().name + ' logo'" />
    }
    <span class="brand">{{ branding().name }}</span>
    <span class="app-label">{{ appLabel }}</span>
  </header>
  <nav class="nav" aria-label="Main">
    <ul>
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
            item.label
          }}</a>
        </li>
      }
    </ul>
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
