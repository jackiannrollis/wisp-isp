# Example inventory: copy to inventories/staging/ (or production/) and fill in the real values there.
# Only this example is committed; real inventories are ignored by git (.gitignore). The addresses are
# from the documentation range (RFC 5737) and reach nothing.
all:
  children:
    staging:
      hosts:
        staging-1:
          ansible_host: 192.0.2.10
          wg_hub_address: 10.210.0.1/24
    core:
      hosts:
        core-1:
          ansible_host: 192.0.2.20
          wg_hub_address: 10.200.0.1/24
    nairobi:
      # Pending Q2 (context/open-questions.md): the data centre is not chosen yet.
      hosts:
        nairobi-1:
          ansible_host: 192.0.2.30
          wg_hub_address: 10.200.1.1/24
    wireguard_hubs:
      children:
        staging:
        core:
        nairobi:
    # Where the API, web front, FreeRADIUS node A and the tunnel worker run (infra/stack/compose.yml).
    # The Nairobi node runs the replica and FreeRADIUS node B instead (pending Q2).
    stack_hosts:
      children:
        staging:
        core:
