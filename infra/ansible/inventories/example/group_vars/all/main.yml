# Settings every host shares. Placeholders: replace in the real inventory. Secrets go in vault.yml
# beside this file, encrypted with ansible-vault (infra/ops/ops.ps1 secrets <inventory>).
platform_domain: example.test          # the operator's domain; tenants get <subdomain>.<platform_domain>
acme_email: ops@example.test           # Let's Encrypt account; expiry warnings go here
operator_user: corebalt                # the only login account; key only, sudo without password
operator_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE operator@example"
# Where SSH is accepted from (the operator's addresses); everything else is closed except 80/443 and
# the WireGuard port. Required: provisioning stops while this is empty.
ssh_allowed_cidrs:
  - 198.51.100.7/32
# LUKS data disk (docs/08, ADR 0009). manual: the operator unlocks after every reboot (ops unlock),
# the passphrase never stored on the host. keyfile: unlocks at boot from a key on the root disk,
# which protects a detached or disposed disk only.
data_volume_device: /dev/disk/by-id/scsi-0HC_Volume_EXAMPLE
data_volume_unlock: manual
# WireGuard hub port, public on hubs (base opens it, wireguard_hub listens on it).
wireguard_port: 51820
# Router onboarding scripts (docs/06): routers dial the hub by stack_hub_endpoint (default
# hub-a.<platform_domain>, an A record for this host) and restricted customers may reach only
# stack_public_address (default ansible_host; set it when ansible_host is a name).
# The GHCR namespace the images are published under (the GitHub user or organisation).
ghcr_owner: example
# Wildcard certificate by ACME DNS-01: cloudflare or hetzner (decisions.md 2026-10-21); the API
# token is vault_acme_dns_api_token.
stack_acme_dns_provider: cloudflare
# Backups (docs/08; infra/ops/runbooks/backups.md): an S3-compatible bucket in the EU, one per
# inventory, e.g. Hetzner Object Storage in the host's region (fsn1.your-objectstorage.com); its
# credentials are in vault.yml, and the repository is encrypted with vault_backup_cipher_pass.
backup_s3_endpoint: fsn1.your-objectstorage.com
backup_s3_bucket: corebalt-example-backups
backup_s3_region: fsn1
stack_backup_uri_style: host       # bucket.endpoint; "path" when the provider wants endpoint/bucket
stack_backup_retention_full: 30    # nightly full backups kept with their WAL: 30 days of point-in-time recovery
# Monitoring (docs/08; infra/ops/runbooks/monitoring.md): alerts by email through an SMTP account
# (its password is vault_smtp_password) to monitoring_alert_email (acme_email unless set), and
# optionally a webhook (vault_alert_webhook_url) and a dead man's switch (vault_deadman_url). Leave the
# host empty for no email. Retention: 30 days of metrics and logs on the data disk.
monitoring_smtp_host: smtp.example.test:587
monitoring_smtp_user: alerts@example.test
monitoring_smtp_from: alerts@example.test
monitoring_alert_email: ops@example.test
monitoring_prometheus_retention: 30d
monitoring_loki_retention: 720h
ansible_user: "{{ operator_user }}"
