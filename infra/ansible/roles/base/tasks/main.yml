---
# Host hardening every Corebalt host gets (decisions.md 2026-10-21, docs/08 Security).
- name: Refuse to close SSH without a list of operator addresses
  ansible.builtin.assert:
    that:
      - ssh_allowed_cidrs | length > 0
      - operator_ssh_public_keys | length > 0
    fail_msg: Set ssh_allowed_cidrs and operator_ssh_public_keys in the inventory first.

- name: Base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - unattended-upgrades
      - apt-listchanges
      - chrony
      - cryptsetup
      - e2fsprogs
      - wireguard-tools
      - jq
    state: present
    # wireguard-tools would otherwise recommend a kernel image (a real-time one on Debian 13).
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Operator account
  ansible.builtin.user:
    name: "{{ operator_user }}"
    shell: /bin/bash
    groups: [sudo]
    append: true
    password: "!"

- name: Operator keys (the only way in)
  ansible.posix.authorized_key:
    user: "{{ operator_user }}"
    key: "{{ operator_ssh_public_keys | join('\n') }}"
    exclusive: true

- name: Operator sudo without a password (there is no password to type)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-corebalt-operator
    content: "{{ operator_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: SSH with keys only, no root login
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-corebalt.conf
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload sshd

- name: Never lock the operator out (this session's address must stay allowed)
  ansible.builtin.assert:
    that:
      - ssh_allowed_cidrs | map('ansible.utils.network_in_network', ansible_facts['env']['SSH_CLIENT'].split(' ')[0]) | select | list | length > 0
    fail_msg: >-
      This session comes from {{ ansible_facts['env']['SSH_CLIENT'].split(' ')[0] }}, which is not in
      ssh_allowed_cidrs; turning the firewall on would lock you out.
  when: ansible_facts['env']['SSH_CLIENT'] is defined

- name: Firewall denies incoming by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Firewall allows outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Firewall denies routed traffic by default
  community.general.ufw:
    direction: routed
    default: deny

- name: SSH only from the operator's addresses
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ ssh_allowed_cidrs }}"

- name: Public web ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ base_public_tcp_ports }}"

- name: Public WireGuard port on hubs
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_port | string }}"
    proto: udp
  when: "'wireguard_hubs' in group_names"

- name: Firewall on
  community.general.ufw:
    state: enabled

- name: Unattended security upgrades
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 52corebalt-unattended-upgrades

- name: Time sync
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian
      {{ base_docker_apt_release }} stable
    filename: docker
    state: present

- name: Docker engine and compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker daemon settings (log rotation; no userland proxy)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "userland-proxy": false,
        "live-restore": true
      }
  notify: Restart docker

- name: Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
