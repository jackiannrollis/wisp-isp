# Where the stack lives on the data disk (data_volume_mount) and what it publishes.
stack_dir: "{{ data_volume_mount | default('/srv/corebalt') }}/stack"
stack_data_dir: "{{ data_volume_mount | default('/srv/corebalt') }}"
stack_tls_mode: dns
stack_acme_dns_provider: cloudflare
# Staging only: SMS goes to these E.164 numbers alone; empty means no restriction (production).
stack_sms_allowlist: ""
# A (Hetzner core) or B (Nairobi): which hub this host's tunnel worker serves.
stack_worker_hub: A
# Router onboarding scripts (docs/06, ADR 0013): how a router reaches this hub and the pay page. The
# endpoint is a DNS name, so a replacement host is one record change (runbooks/failover-drill.md);
# the public address is where pay.<domain> resolves (restricted customers may reach only it).
stack_hub_endpoint: "hub-a.{{ platform_domain }}"
stack_public_address: "{{ ansible_host }}"
stack_ntp_servers: pool.ntp.org
# Image uids of the official images, for the bind-mounted data directories.
stack_postgres_uid: 999
stack_rabbitmq_uid: 999
stack_caddy_uid: 1000
# Backups (docs/08; infra/ops/runbooks/backups.md): pgBackRest from the postgres container to an
# S3-compatible bucket (Hetzner Object Storage in the host's region), encrypted with the vault's
# passphrase. backup_s3_endpoint, backup_s3_bucket and backup_s3_region come from the inventory.
stack_backup_uri_style: host    # host: bucket.endpoint (pgBackRest's default); path: endpoint/bucket
stack_backup_repo_path: "corebalt-{{ inventory_dir | basename }}"    # one repository per inventory in the bucket
stack_backup_retention_full: 30    # nightly full backups kept, with their WAL: 30 days of point-in-time recovery
stack_backup_on_calendar: "*-*-* 01:00:00 UTC"            # nightly; 04:00 in Nairobi
stack_drill_on_calendar: "Sun *-*-01..07 03:00:00 UTC"     # the first Sunday of every month
# The router sync (infra/stack/routersync.sh, ADR 0013): the hub's peers and FreeRADIUS's clients
# follow the routers in the database, every minute.
stack_routersync_on_calendar: "*-*-* *:*:00"
# The drill's scratch instance (a restore holds the RADIUS credentials in clear, ADR 0009) and the
# backup metrics (text files for node_exporter), both on the data disk.
stack_drill_dir: "{{ stack_data_dir }}/drill"
stack_metrics_dir: "{{ stack_data_dir }}/metrics"
