---
# Provision every host (decisions.md 2026-10-21): hardening, the LUKS data disk, the WireGuard hub, then
# the application stack with its backups and the monitoring project on the stack hosts.
- name: Base hardening and the data disk
  hosts: all
  become: true
  roles:
    - base
    - data_volume

- name: WireGuard hubs
  hosts: wireguard_hubs
  become: true
  roles:
    - wireguard_hub

- name: The application stack and its monitoring (core and staging hosts)
  hosts: stack_hosts
  become: true
  roles:
    - stack
    - monitoring
