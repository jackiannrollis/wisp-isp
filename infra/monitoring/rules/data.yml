# PostgreSQL, RabbitMQ and Redis (docs/08: replication lag, queue depth, dead letters). The replica and
# node B are pending Q2 (context/open-questions.md): CorebaltReplicationLag is in place for the day a
# replica reports to this Prometheus and is silent until then. Unit tests: tests/data.yml.
groups:
  - name: corebalt-data
    rules:
      - alert: CorebaltPostgresDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not answering the exporter"
          description: "postgres_exporter could not connect to PostgreSQL for 5 minutes: the database is down, or isp_monitor's password in the monitoring .env is not the one stackctl set. docker compose logs postgres on the host."
      - alert: CorebaltPostgresConnectionsHigh
        expr: |
          sum by (instance) (pg_stat_database_numbackends) / on (instance) pg_settings_max_connections > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL uses more than 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of the connection slots are taken: the API pools, FreeRADIUS and the worker together. pg_stat_activity shows who holds them."
      - alert: CorebaltPostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname="isp"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks in the isp database"
          description: "Deadlocks happened in the last 15 minutes. The API log (level ERROR) names the transactions involved."
      - alert: CorebaltReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The PostgreSQL replica is more than 30 s behind"
          description: "docs/08: FreeRADIUS node B reads the replica, so its logins see old subscription state. The replica is pending Q2; this fires only once one reports here."
      - alert: CorebaltRabbitDeadLetters
        expr: rabbitmq_detailed_queue_messages{queue=~".+\\.dlq"} > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} message(s) in dead-letter queue {{ $labels.queue }}"
          description: "A consumer failed three times on these events (conventions.md, Events and queues); the business change behind them did not happen. Inspect in the RabbitMQ UI (ssh -L 15672:127.0.0.1:15672), fix, and shovel the messages back."
      - alert: CorebaltRabbitQueueGrowing
        expr: |
          rabbitmq_detailed_queue_messages{queue!~".+\\.dlq"} > 100
            and deriv(rabbitmq_detailed_queue_messages{queue!~".+\\.dlq"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} has been growing for 10 minutes"
          description: "{{ $value }} messages and rising: its consumer is slow or stopped (docs/08). Restores, SMS and roll-ups are delayed, not lost. docker compose logs api-1 api-2 tunnel-worker."
      - alert: CorebaltRabbitQueueWithoutConsumers
        expr: rabbitmq_detailed_queue_consumers{queue!~".+\\.dlq"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Nobody consumes queue {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has had no consumer for 15 minutes: the instance that owns it is down or its listener stopped. Events wait in the queue meanwhile (E4: access never depends on them)."
      - alert: CorebaltRabbitAlarm
        expr: rabbitmq_alarms_memory_used_watermark == 1 or rabbitmq_alarms_free_disk_space_watermark == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ raised a resource alarm and blocks publishers"
          description: "Memory or disk watermark reached: RabbitMQ stops accepting publishes, so the outbox relay backs up. Free disk or memory on the host; docker compose logs rabbitmq."
      - alert: CorebaltRedisDown
        expr: redis_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is not answering the exporter"
          description: "Redis has been unreachable for 5 minutes. Sign-in limits and token versions fall back to the database (TokenVersions), slower but correct. docker compose logs redis."
      - alert: CorebaltRedisRejectingConnections
        expr: increase(redis_rejected_connections_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Redis rejected connections"
          description: "Redis hit its client limit in the last 10 minutes; the API instances leak or exhaust connections. redis-cli info clients."
