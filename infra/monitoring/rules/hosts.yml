# Host alerts (docs/08 Monitoring: "standard host alerts" for disk and the rest), from node_exporter. The
# data disk (/srv/corebalt) holds PostgreSQL, the logs and the metrics: a full disk there stops the
# database, so it is watched by level and by trend. Unit tests: tests/hosts.yml.
groups:
  - name: corebalt-hosts
    rules:
      - alert: CorebaltDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% free on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free. Old images (docker system prune), Prometheus and Loki retention, radacct partitions; infra/ops/runbooks/monitoring.md."
      - alert: CorebaltDiskCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"} < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% free on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free: PostgreSQL stops writing when the data disk is full. Free space now (infra/ops/runbooks/monitoring.md)."
      - alert: CorebaltDiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
            and node_filesystem_avail_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"} < 0.3
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} will be full within a day at the current rate"
          description: "The last six hours' trend on {{ $labels.mountpoint }} reaches zero within 24 hours. Find what grows (du on the data disk; the Loki and Prometheus directories, radacct) before it fills."
      - alert: CorebaltFilesystemReadOnly
        expr: node_filesystem_readonly{mountpoint=~"/|/srv/corebalt",fstype!~"tmpfs|overlay"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is mounted read-only"
          description: "The kernel remounted {{ $labels.mountpoint }} read-only, usually after a disk error (dmesg). Nothing writes any more; infra/ops/runbooks/monitoring.md."
      - alert: CorebaltMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of memory available"
          description: "{{ $value | humanizePercentage }} of the host's memory is available. The JVMs are capped by MaxRAMPercentage; check the API heap and Loki (docker stats)."
      - alert: CorebaltCpuHigh
        expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% for 30 minutes"
          description: "The host has been busier than 90% for half an hour (top, docker stats): a runaway job, a RADIUS storm or a backup running long."
      - alert: CorebaltClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The host clock is off by more than half a second"
          description: "chrony is not keeping time (chronyc tracking). Expiry, Session-Timeout and the M-Pesa timestamps depend on the clock."
      - alert: CorebaltTextfileMetricsBroken
        expr: node_textfile_scrape_error == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter cannot read a metrics text file"
          description: "A file in /srv/corebalt/metrics is malformed or unreadable (backupctl and probes write them). The backup, RADIUS and tunnel alerts are blind until it is fixed."
