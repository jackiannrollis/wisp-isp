# promtool unit tests for rules/hosts.yml. Sizes in bytes; test time starts at the epoch.
rule_files:
  - ../rules/hosts.yml
evaluation_interval: 1m
tests:
  # The data disk at 10% free, the root disk at 50%, a boot partition that is not watched.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "10e9+0x60"
      - series: 'node_filesystem_size_bytes{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "100e9+0x60"
      - series: 'node_filesystem_avail_bytes{mountpoint="/",fstype="ext4",instance="h"}'
        values: "50e9+0x60"
      - series: 'node_filesystem_size_bytes{mountpoint="/",fstype="ext4",instance="h"}'
        values: "100e9+0x60"
      - series: 'node_filesystem_avail_bytes{mountpoint="/boot",fstype="vfat",instance="h"}'
        values: "1e6+0x60"
      - series: 'node_filesystem_size_bytes{mountpoint="/boot",fstype="vfat",instance="h"}'
        values: "100e6+0x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: CorebaltDiskLow
        exp_alerts: []
      - eval_time: 20m
        alertname: CorebaltDiskLow
        exp_alerts:
          - exp_labels: { severity: warning, mountpoint: /srv/corebalt, fstype: ext4, instance: h }
            exp_annotations:
              summary: "Less than 15% free on /srv/corebalt"
              description: "/srv/corebalt has 10% free. Old images (docker system prune), Prometheus and Loki retention, radacct partitions; infra/ops/runbooks/monitoring.md."
      - eval_time: 20m
        alertname: CorebaltDiskCritical
        exp_alerts: []
  # 3% free: critical after 5 minutes.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "3e9+0x10"
      - series: 'node_filesystem_size_bytes{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "100e9+0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: CorebaltDiskCritical
        exp_alerts:
          - exp_labels: { severity: critical, mountpoint: /srv/corebalt, fstype: ext4, instance: h }
            exp_annotations:
              summary: "Less than 5% free on /srv/corebalt"
              description: "/srv/corebalt has 3% free: PostgreSQL stops writing when the data disk is full. Free space now (infra/ops/runbooks/monitoring.md)."
  # Losing 20 MB a minute from 20 GB: empty in under a day.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "20e9-20e6x480"
      - series: 'node_filesystem_size_bytes{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "100e9+0x480"
    alert_rule_test:
      - eval_time: 8h
        alertname: CorebaltDiskFillingUp
        exp_alerts:
          - exp_labels: { severity: warning, mountpoint: /srv/corebalt, fstype: ext4, instance: h }
            exp_annotations:
              summary: "/srv/corebalt will be full within a day at the current rate"
              description: "The last six hours' trend on /srv/corebalt reaches zero within 24 hours. Find what grows (du on the data disk; the Loki and Prometheus directories, radacct) before it fills."
  - interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{mountpoint="/srv/corebalt",fstype="ext4",instance="h"}'
        values: "1+0x10"
      - series: 'node_memory_MemAvailable_bytes{instance="h"}'
        values: "0.5e9+0x20"
      - series: 'node_memory_MemTotal_bytes{instance="h"}'
        values: "8e9+0x20"
      - series: 'node_cpu_seconds_total{mode="idle",cpu="0",instance="h"}'
        values: "0+3x40"
      - series: 'node_cpu_seconds_total{mode="idle",cpu="1",instance="h"}'
        values: "0+3x40"
      - series: 'node_timex_offset_seconds{instance="h"}'
        values: "0.8+0x15"
      - series: 'node_textfile_scrape_error{instance="h"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: CorebaltFilesystemReadOnly
        exp_alerts:
          - exp_labels: { severity: critical, mountpoint: /srv/corebalt, fstype: ext4, instance: h }
            exp_annotations:
              summary: "/srv/corebalt is mounted read-only"
              description: "The kernel remounted /srv/corebalt read-only, usually after a disk error (dmesg). Nothing writes any more; infra/ops/runbooks/monitoring.md."
      - eval_time: 16m
        alertname: CorebaltMemoryLow
        exp_alerts:
          - exp_labels: { severity: warning, instance: h }
            exp_annotations:
              summary: "Less than 10% of memory available"
              description: "6.25% of the host's memory is available. The JVMs are capped by MaxRAMPercentage; check the API heap and Loki (docker stats)."
      - eval_time: 20m
        alertname: CorebaltCpuHigh
        exp_alerts: []
      - eval_time: 36m
        alertname: CorebaltCpuHigh
        exp_alerts:
          - exp_labels: { severity: warning, instance: h }
            exp_annotations:
              summary: "CPU above 90% for 30 minutes"
              description: "The host has been busier than 90% for half an hour (top, docker stats): a runaway job, a RADIUS storm or a backup running long."
      - eval_time: 11m
        alertname: CorebaltClockSkew
        exp_alerts:
          - exp_labels: { severity: warning, instance: h }
            exp_annotations:
              summary: "The host clock is off by more than half a second"
              description: "chrony is not keeping time (chronyc tracking). Expiry, Session-Timeout and the M-Pesa timestamps depend on the clock."
      - eval_time: 16m
        alertname: CorebaltTextfileMetricsBroken
        exp_alerts:
          - exp_labels: { severity: warning, instance: h }
            exp_annotations:
              summary: "node_exporter cannot read a metrics text file"
              description: "A file in /srv/corebalt/metrics is malformed or unreadable (backupctl and probes write them). The backup, RADIUS and tunnel alerts are blind until it is fixed."
