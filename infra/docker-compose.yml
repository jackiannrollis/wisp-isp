# Local development stack for the Corebalt ISP Platform (docs/02, Environments).
# Usage (from the repo root): infra/scripts/up.ps1 or infra/scripts/up.sh; see CLAUDE.md.
# Settings and passwords come from infra/.env (copy infra/.env.example).

name: ${COMPOSE_PROJECT_NAME:-corebalt-isp}

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in infra/.env}
      POSTGRES_DB: postgres
      ISP_DB_OWNER_PASSWORD: ${ISP_DB_OWNER_PASSWORD:?set in infra/.env}
      ISP_DB_APP_PASSWORD: ${ISP_DB_APP_PASSWORD:?set in infra/.env}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:?set in infra/.env}
      ISP_DB_WORKER_PASSWORD: ${ISP_DB_WORKER_PASSWORD:?set in infra/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isp"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-isp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in infra/.env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Cache and rate limits only (ADR 0003); nothing depends on it for correctness yet.
  redis:
    image: redis:8.8
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      ISP_DB_URL: jdbc:postgresql://postgres:5432/isp
      ISP_DB_OWNER_USER: isp_owner
      ISP_DB_OWNER_PASSWORD: ${ISP_DB_OWNER_PASSWORD}
      ISP_DB_APP_USER: isp_app
      ISP_DB_APP_PASSWORD: ${ISP_DB_APP_PASSWORD}
      ISP_RABBITMQ_HOST: rabbitmq
      ISP_RABBITMQ_USER: ${RABBITMQ_USER:-isp}
      ISP_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Tenant-secret master key (docs/07): outside the database, only in the environment.
      ISP_MASTER_KEY: ${ISP_MASTER_KEY:?set in infra/.env}
      # Public HTTPS origin Safaricom calls (a tunnel to Caddy :8088 in the lab), docs/05.
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://localhost:8088}
      ISP_REDIS_HOST: redis
      # Token signing key (ADR 0010): environment only, never a file in the image.
      ISP_JWT_KID: ${ISP_JWT_KID:?run infra/scripts/jwt-key first}
      ISP_JWT_PRIVATE_KEY: ${ISP_JWT_PRIVATE_KEY:?run infra/scripts/jwt-key first}
      ISP_JWT_RETIRED_KEYS: ${ISP_JWT_RETIRED_KEYS:-}
      ISP_ALLOWED_ORIGINS: ${ISP_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:8088}
      ISP_BOOTSTRAP_ADMIN_EMAIL: ${ISP_BOOTSTRAP_ADMIN_EMAIL:-}
      ISP_BOOTSTRAP_ADMIN_PASSWORD: ${ISP_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Router onboarding scripts (docs/06, ADR 0013): the hub as a router reaches it. The hub's public
      # key is read from the wireguard volume (mounted read-only below); the endpoint and the public
      # address are this machine as the lab router sees it (infra/lab/README.md).
      ISP_HUB_A_PUBLIC_KEY_FILE: /run/wireguard/hub.pub
      ISP_HUB_A_ENDPOINT: ${HUB_A_ENDPOINT:-corebalt.localhost}
      ISP_HUB_A_PORT: ${WG_PORT:-51820}
      ISP_HUB_A_ADDRESS: ${WG_HUB_ADDRESS:-10.200.0.1/24}
      ISP_PORTAL_ADDRESS: ${PUBLIC_ADDRESS:-127.0.0.1}
      ISP_PAY_PAGE_PORT: ${CADDY_PAYPAGE_PORT:-8089}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - wireguard-data:/run/wireguard:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
        condition: service_healthy

  # WireGuard hub (ADR 0006, N6): lab routers peer here; RADIUS, CoA, REST and SNMP to routers only
  # travel through the tunnel. Peers (public keys only) live in the wireguard-data volume and are
  # added with: docker compose exec wireguard wireguard-hub add-peer <name> <public key> <tunnel ip>/32
  wireguard:
    build:
      context: ./wireguard
    # Root inside the container, but with NET_ADMIN only (see infra/wireguard/Dockerfile).
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      WG_HUB_ADDRESS: ${WG_HUB_ADDRESS:-10.200.0.1/24}
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      # FreeRADIUS shares this network namespace, so its ports are published here.
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"
    volumes:
      - wireguard-data:/var/lib/wireguard

  # FreeRADIUS reads the views the backend's Flyway migrations create, so it starts after the API
  # is healthy. Logins never depend on the API at runtime (ADR 0004); only on the database.
  # It runs in the WireGuard hub's network namespace so routers are seen by their tunnel address
  # (radius_client_v3.nasname) and CoA/Disconnect leave from the hub address.
  freeradius:
    build:
      context: ../radius
    # Logs go to stdout. Debug output (freeradius -X) prints connection settings including the DB
    # password; use it only ad hoc on a lab machine: docker compose run --rm freeradius freeradius -X
    command: ["freeradius", "-f", "-l", "stdout"]
    network_mode: "service:wireguard"
    environment:
      RADIUS_DB_HOST: postgres
      RADIUS_DB_PORT: "5432"
      RADIUS_DB_NAME: isp
      RADIUS_DB_USER: isp_radius
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD}
      RADIUS_LAB_SECRET: ${RADIUS_LAB_SECRET:?set in infra/.env}
      # The Status-Server site on the container's loopback (radius/raddb/sites-available/corebalt-status),
      # asked by the monitoring probe on a host; locally nothing asks, so a placeholder will do.
      RADIUS_STATUS_SECRET: ${RADIUS_STATUS_SECRET:-local-status-probe-not-a-secret}
    depends_on:
      wireguard:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Tunnel worker (ADR 0011): the backend image in worker mode, the only process that talks to
  # routers (RouterOS REST poll every 60 s; CoA later) and the only one that decrypts router REST
  # credentials. Local development shares the hub container's network namespace, as FreeRADIUS does;
  # on the Hetzner and Nairobi hosts WireGuard runs on the host (wg-quick) and the worker uses host
  # networking instead (infra/README.md). One replica per hub. No published port: health only.
  tunnel-worker:
    build:
      context: ../backend
    network_mode: "service:wireguard"
    environment:
      SPRING_PROFILES_ACTIVE: local,worker
      SERVER_PORT: "8090"
      ISP_DB_URL: jdbc:postgresql://postgres:5432/isp
      ISP_DB_APP_USER: isp_worker
      # The synthetic login probe (ADR 0019): FreeRADIUS in the same namespace, from 127.0.0.3, the probe NAS
      # that infra/lab/scripts/seed creates (probe-setup A 127.0.0.3).
      ISP_PROBE_ENABLED: "true"
      ISP_PROBE_RADIUS_HOST: 127.0.0.1
      ISP_PROBE_NAS_ADDRESS: 127.0.0.3
      ISP_DB_APP_PASSWORD: ${ISP_DB_WORKER_PASSWORD:?set in infra/.env}
      ISP_RABBITMQ_HOST: rabbitmq
      ISP_RABBITMQ_USER: ${RABBITMQ_USER:-isp}
      ISP_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ISP_REDIS_HOST: redis
      # Decrypts router REST credentials (T4); holds no token signing key.
      ISP_MASTER_KEY: ${ISP_MASTER_KEY:?set in infra/.env}
      ISP_WORKER_HUB: A
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    depends_on:
      wireguard:
        condition: service_healthy
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.11.7
    ports:
      - "${CADDY_HTTP_PORT:-8088}:80"
      # Lab walled-garden pay page for restricted PPPoE users (infra/lab/README.md).
      - "${CADDY_PAYPAGE_PORT:-8089}:8089"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  # One-off migrations without starting the API: infra/scripts/migrate.(ps1|sh).
  flyway:
    image: flyway/flyway:11
    profiles: ["tools"]
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/isp
      FLYWAY_USER: isp_owner
      FLYWAY_PASSWORD: ${ISP_DB_OWNER_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # MikroTik CHR is not a container: the network lab runs two CHR VMs in Hyper-V (a router and a
  # PPPoE client) that peer with the wireguard service above. See infra/lab/README.md.

volumes:
  postgres-data:
  rabbitmq-data:
  wireguard-data:
