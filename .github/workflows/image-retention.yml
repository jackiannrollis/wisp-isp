name: Image retention

# GHCR retention (decisions.md 2026-10-21): keep the last 30 release images per package, anything
# tagged deployed-* or previous-*, and their signatures (infra/ops/ghcr-retention.sh). Deleting a
# package version is permanent, so the weekly run is a dry run unless the repository variable
# IMAGE_RETENTION_APPLY is "true"; a manual run can apply once with the input below.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete for real (otherwise print the plan)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plan, and delete when applying
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          KEEP: "30"
          APPLY: ${{ inputs.apply == true || vars.IMAGE_RETENTION_APPLY == 'true' }}
        run: bash infra/ops/ghcr-retention.sh
