name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit, Modulith, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (unit tests, Modulith verification, integration tests)
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Build admin and portal
        run: npm run build
      - name: Test admin and portal
        run: npm run test

  e2e:
    name: End-to-end (Playwright against the stack, fake Daraja)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Write infra/.env with throwaway secrets (ADR 0012)
        working-directory: infra
        run: |
          cp .env.example .env
          for name in POSTGRES_SUPERUSER_PASSWORD ISP_DB_OWNER_PASSWORD ISP_DB_APP_PASSWORD ISP_DB_WORKER_PASSWORD \
                      RADIUS_DB_PASSWORD RABBITMQ_PASSWORD RADIUS_LAB_SECRET; do
            sed -i "s|^$name=.*|$name=ci-$(openssl rand -hex 16)|" .env
          done
          sed -i "s|^ISP_MASTER_KEY=.*|ISP_MASTER_KEY=$(openssl rand -base64 32)|" .env
          sh scripts/jwt-key.sh
      - name: Start the e2e stack and load the lab fixtures
        run: sh infra/e2e/up.sh --seed
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check the suite
        working-directory: frontend
        run: npm run e2e:typecheck
      - name: Run the suite (sign-in, customer search, Pay Now)
        working-directory: frontend
        run: npm run e2e
      - name: Backend and fake Daraja logs
        if: failure()
        working-directory: infra
        run: docker compose -f docker-compose.yml -f e2e/compose.e2e.yml logs --no-color backend fake-daraja | tail -n 300
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  compose:
    name: Compose and container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        working-directory: infra
        run: docker compose --env-file .env.example config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: corebalt/isp-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build FreeRADIUS image
        uses: docker/build-push-action@v7
        with:
          context: radius
          load: true
          tags: corebalt/isp-freeradius:${{ github.sha }}
      - name: Build WireGuard hub image
        uses: docker/build-push-action@v7
        with:
          context: infra/wireguard
          load: true
          tags: corebalt/isp-wireguard:${{ github.sha }}
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: corebalt/isp-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan FreeRADIUS image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: corebalt/isp-freeradius:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan WireGuard hub image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: corebalt/isp-wireguard:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan Maven and npm dependencies and IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
