spring:
  application:
    name: isp-platform
  threads:
    virtual:
      enabled: true
  # The application connects as isp_app, which owns no tables, so row-level security applies.
  datasource:
    url: ${ISP_DB_URL:jdbc:postgresql://localhost:5432/isp}
    username: ${ISP_DB_APP_USER:isp_app}
    password: ${ISP_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  # Flyway runs as the owner role; the application role cannot change the schema.
  flyway:
    url: ${ISP_DB_URL:jdbc:postgresql://localhost:5432/isp}
    user: ${ISP_DB_OWNER_USER:isp_owner}
    password: ${ISP_DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${ISP_RABBITMQ_HOST:localhost}
    port: ${ISP_RABBITMQ_PORT:5672}
    username: ${ISP_RABBITMQ_USER:isp}
    password: ${ISP_RABBITMQ_PASSWORD:}
    publisher-confirm-type: simple
    # Consumers (conventions.md, Events and queues): prefetch 10; three retries with backoff
    # 5 s, 30 s, 2 min, then the message is rejected into the queue's .dlq.
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 5s
          multiplier: 6
          max-interval: 2m
          max-attempts: 4
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # Behind Caddy: the client address comes from X-Forwarded-For, trusted only from internal proxies
  # (Tomcat RemoteIpValve). The backend port must never be reachable except through the proxy.
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  # Structured JSON; the MDC (tenantId, correlationId) is included in every line.
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.corebalt.isp: INFO

isp:
  secrets:
    # docs/07: the platform master key lives outside the database (base64, 32 bytes).
    master-key: ${ISP_MASTER_KEY:}
  mpesa:
    # Where Safaricom reaches this platform (the public HTTPS origin in front of Caddy).
    callback-base-url: ${CALLBACK_BASE_URL:http://localhost:8088}
    # Daraja callback source addresses. VERIFY against Safaricom's current publication before
    # go-live; these are the ranges published for Daraja callbacks at the time of writing.
    callback-allowed-cidrs: >-
      196.201.214.200/32,196.201.214.206/32,196.201.213.114/32,196.201.214.207/32,
      196.201.214.208/32,196.201.213.44/32,196.201.212.127/32,196.201.212.138/32,
      196.201.212.129/32,196.201.212.136/32,196.201.212.74/32,196.201.212.69/32
  outbox:
    relay:
      enabled: true
      interval: 1s
      batch-size: 100

---
spring:
  config:
    activate:
      on-profile: local
isp:
  mpesa:
    # Local only: callbacks from this machine and the compose network (lab replays, the sandbox
    # script through a tunnel). Never a 0.0.0.0/0 default.
    callback-allowed-cidrs: 127.0.0.1/32,::1/128,172.16.0.0/12
logging:
  level:
    com.corebalt.isp: DEBUG
    # The relay opens a transaction per tenant every second; keep its begin/commit lines out.
    com.corebalt.isp.shared.tenant.TenantAwareJpaTransactionManager: INFO
